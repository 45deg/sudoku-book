<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">論理式if x then y else zの縮約された二分決定図</title>
  <desc id="desc">根のxから、0の破線はzへ、1の実線はyへ進みます。yとzからは、真偽に応じて共通の0終端と1終端へ進みます。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
    <style>
      .edge { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .low { stroke-dasharray: 8 7; }
      .node { fill: #e8f3ff; stroke: #075985; stroke-width: 3; }
      .terminal { fill: #f8fafc; stroke: #475569; stroke-width: 3; }
      .label { font: 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .edge-label { font: 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 650; fill: #334155; text-anchor: middle; }
      .legend { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
    </style>
  </defs>

  <path class="edge low" data-connector="true" d="M361 104 C330 138 286 170 250 197"/>
  <path class="edge" data-connector="true" d="M399 104 C430 138 474 170 510 197"/>

  <path class="edge low" data-connector="true" d="M220 247 C207 281 197 315 191 342"/>
  <path class="edge" data-connector="true" d="M255 239 C326 286 419 322 535 352"/>
  <path class="edge low" data-connector="true" d="M505 239 C434 286 341 322 225 352"/>
  <path class="edge" data-connector="true" d="M540 247 C553 281 563 315 569 342"/>

  <circle class="node" cx="380" cy="82" r="30"/>
  <text class="label" x="380" y="82">x</text>
  <circle class="node" cx="230" cy="220" r="30"/>
  <text class="label" x="230" y="220">z</text>
  <circle class="node" cx="530" cy="220" r="30"/>
  <text class="label" x="530" y="220">y</text>

  <rect class="terminal" x="160" y="350" width="60" height="52" rx="9"/>
  <text class="label" x="190" y="376">0</text>
  <rect class="terminal" x="540" y="350" width="60" height="52" rx="9"/>
  <text class="label" x="570" y="376">1</text>

  <text class="edge-label" x="310" y="145" data-collision-ignore="true">0</text>
  <text class="edge-label" x="450" y="145" data-collision-ignore="true">1</text>
  <text class="edge-label" x="194" y="294" data-collision-ignore="true">0</text>
  <text class="edge-label" x="322" y="295" data-collision-ignore="true">1</text>
  <text class="edge-label" x="438" y="295" data-collision-ignore="true">0</text>
  <text class="edge-label" x="566" y="294" data-collision-ignore="true">1</text>

  <line class="edge low" data-connector="true" x1="25" y1="28" x2="82" y2="28" marker-end="none"/>
  <text class="legend" x="94" y="34">0 の枝</text>
  <line class="edge" data-connector="true" x1="175" y1="28" x2="232" y2="28" marker-end="none"/>
  <text class="legend" x="244" y="34">1 の枝</text>
</svg>
