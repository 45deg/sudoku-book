<svg xmlns="http://www.w3.org/2000/svg" width="530" height="540" viewBox="0 0 530 540" role="img" aria-labelledby="title desc">
  <title id="title">9x9数独の入力盤面</title>
  <desc id="desc">ヒント数字が配置された標準的な9x9数独盤面。</desc>
  <defs>
    <style>
      text { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #1f1f1f; }
      .title { font-size: 16px; font-weight: 600; }
      .num { font-size: 24px; font-weight: bold; fill: #1a252c; text-anchor: middle; }
      .block-bg { fill: #f4f6f8; }
      .thin-line { stroke: #bdc3c7; stroke-width: 1; }
      .thick-line { stroke: #2c3e50; stroke-width: 3; stroke-linecap: square; }
    </style>
  </defs>

  <rect width="530" height="540" fill="#ffffff"/>
  <text x="265" y="30" text-anchor="middle" class="title">9×9 数独の例</text>

  <!-- 3x3 Block Backgrounds (checker pattern) -->
  <rect x="190" y="50" width="150" height="150" class="block-bg"/>
  <rect x="40" y="200" width="150" height="150" class="block-bg"/>
  <rect x="340" y="200" width="150" height="150" class="block-bg"/>
  <rect x="190" y="350" width="150" height="150" class="block-bg"/>

  <!-- Thin Grid Lines -->
  <!-- Vertical -->
  <line x1="90" y1="50" x2="90" y2="500" class="thin-line"/>
  <line x1="140" y1="50" x2="140" y2="500" class="thin-line"/>
  <line x1="240" y1="50" x2="240" y2="500" class="thin-line"/>
  <line x1="290" y1="50" x2="290" y2="500" class="thin-line"/>
  <line x1="390" y1="50" x2="390" y2="500" class="thin-line"/>
  <line x1="440" y1="50" x2="440" y2="500" class="thin-line"/>
  <!-- Horizontal -->
  <line x1="40" y1="100" x2="490" y2="100" class="thin-line"/>
  <line x1="40" y1="150" x2="490" y2="150" class="thin-line"/>
  <line x1="40" y1="250" x2="490" y2="250" class="thin-line"/>
  <line x1="40" y1="300" x2="490" y2="300" class="thin-line"/>
  <line x1="40" y1="400" x2="490" y2="400" class="thin-line"/>
  <line x1="40" y1="450" x2="490" y2="450" class="thin-line"/>

  <!-- Thick Block Boundary Lines -->
  <!-- Vertical -->
  <line x1="40" y1="50" x2="40" y2="500" class="thick-line"/>
  <line x1="190" y1="50" x2="190" y2="500" class="thick-line"/>
  <line x1="340" y1="50" x2="340" y2="500" class="thick-line"/>
  <line x1="490" y1="50" x2="490" y2="500" class="thick-line"/>
  <!-- Horizontal -->
  <line x1="40" y1="50" x2="490" y2="50" class="thick-line"/>
  <line x1="40" y1="200" x2="490" y2="200" class="thick-line"/>
  <line x1="40" y1="350" x2="490" y2="350" class="thick-line"/>
  <line x1="40" y1="500" x2="490" y2="500" class="thick-line"/>

  <!-- Numbers -->
  <!-- Row 0 -->
  <text x="65" y="83" class="num">5</text>
  <text x="215" y="83" class="num">6</text>
  <text x="365" y="83" class="num">9</text>
  <text x="465" y="83" class="num">2</text>

  <!-- Row 1 -->
  <text x="215" y="133" class="num">1</text>
  <text x="315" y="133" class="num">5</text>
  <text x="365" y="133" class="num">3</text>
  <text x="465" y="133" class="num">8</text>

  <!-- Row 2 -->
  <text x="365" y="183" class="num">5</text>

  <!-- Row 3 -->
  <text x="65" y="233" class="num">8</text>
  <text x="315" y="233" class="num">1</text>
  <text x="415" y="233" class="num">2</text>

  <!-- Row 4 -->
  <text x="315" y="283" class="num">3</text>

  <!-- Row 5 -->
  <text x="115" y="333" class="num">1</text>
  <text x="215" y="333" class="num">9</text>
  <text x="265" y="333" class="num">2</text>
  <text x="365" y="333" class="num">8</text>

  <!-- Row 6 -->
  <text x="115" y="383" class="num">6</text>
  <text x="215" y="383" class="num">5</text>
  <text x="465" y="383" class="num">4</text>

  <!-- Row 7 -->
  <text x="65" y="433" class="num">2</text>
  <text x="115" y="433" class="num">8</text>

  <!-- Row 8 -->
  <text x="65" y="483" class="num">3</text>
  <text x="165" y="483" class="num">5</text>
  <text x="415" y="483" class="num">7</text>
</svg>
